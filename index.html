<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Election Quest — ห้องเรียนพลเมือง</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #102435; color: #f8f5eb; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; }
    main { position: relative; width: min(100vw, 160vh); width: min(100vw, 160dvh); aspect-ratio: 8 / 5; background: #162e42; }
    canvas { display: block; width: 100%; height: 100%; }
    #loading { position: absolute; inset: 0; display: grid; align-content: center; justify-items: center; gap: 12px; padding: 18px; text-align: center; }
    #loading[hidden] { display: none; }
    progress { width: min(65%, 300px); accent-color: #f2cb74; }
    h1, p { margin: 0; }
    h1 { color: #f2cb74; font-size: clamp(20px, 4vw, 36px); }
    .landscape-tip { display: none; position: absolute; top: 100%; left: 0; right: 0; padding: 10px; text-align: center; }
    @media (orientation: portrait) and (max-width: 700px) { .landscape-tip { display: block; } }
  </style>
</head>
<body>
  <main>
    <canvas id="unity-canvas" tabindex="0" aria-label="เกม Election Quest"></canvas>
    <section id="loading" aria-live="polite">
      <h1>Election Quest</h1>
      <p id="status">กำลังโหลดหน่วยเลือกตั้ง</p>
      <progress id="progress" max="1" value="0" aria-label="ความคืบหน้าการโหลด"></progress>
    </section>
    <p class="landscape-tip">หมุนจอเป็นแนวนอนเพื่ออ่านและเล่นได้สะดวกขึ้น</p>
  </main>
  <script>
    const canvas = document.getElementById('unity-canvas');
    const loading = document.getElementById('loading');
    const status = document.getElementById('status');
    const progress = document.getElementById('progress');
    function showError(error) {
      status.textContent = 'เปิดเกมไม่สำเร็จ ลองโหลดหน้าเว็บอีกครั้ง';
      progress.hidden = true;
      console.error(error);
    }

    const loader = document.createElement('script');
    loader.src = 'Build/Web.loader.js';
    loader.onerror = showError;
    loader.onload = () => {
      createUnityInstance(canvas, {
        dataUrl: 'Build/Web.data.unityweb',
        frameworkUrl: 'Build/Web.framework.js.unityweb',
        codeUrl: 'Build/Web.wasm.unityweb',
        streamingAssetsUrl: 'StreamingAssets',
        companyName: "DefaultCompany",
        productName: "ElectionQuest",
        productVersion: "0.1.0"
      }, value => { progress.value = value; })
        .then(() => { loading.hidden = true; })
        .catch(showError);
    };
    document.body.appendChild(loader);
  </script>
</body>
</html>
